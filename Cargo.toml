[workspace]
members = ["crates/workbench-core", "crates/workbench-cli", "crates/workbench-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/latent-sre/agenticsre-rust"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
clap = { version = "4.6.7", features = ["derive"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
libc = "0.2.189"
signal-hook = "0.4.4"
sha2 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "hickory-dns"] }
tokio = { version = "1.53.1", features = ["rt", "net", "time", "macros"] }
webpki-root-certs = "1.0.9"
base64 = "0.22.1"
regex = "1.12"
rcgen = "0.14.10"
rustls = "0.23"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
