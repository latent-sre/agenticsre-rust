name: Validate specifications

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specifications:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install pinned specification dependencies
        run: python -m pip install --require-hashes -r requirements-docs.txt
      - name: Validate schemas examples links and coverage
        run: python -B docs/sre-workbench/verify_specs.py
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
