name: Rust PoC

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends git ripgrep bubblewrap
          for tool in git rg bwrap; do
            test -x "/usr/bin/$tool"
            "/usr/bin/$tool" --version
          done
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install pinned contract validators
        run: python -m pip install --require-hashes -r requirements-docs.txt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Process and CLI behavior
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Build operator CLI
        run: cargo build --locked -p workbench-cli
      - name: Public result schema and mission transaction
        run: python -B tools/verify-poc.py target/debug/save
      - name: Fixed dashboard task contract
        run: python -B tools/verify-tasks.py target/debug/save
      - name: Error-budget numerical and public contract
        run: python -B tools/verify-error-budget.py target/debug/save
      - name: Grafana HTTPS public contract
        run: python -B tools/verify-grafana.py target/debug/save
